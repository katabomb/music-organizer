<body>
<header><h1>日本語歌謡曲風インスト自動生成機</h1><div class="sub">Web Audio APIだけでブラウザ内合成。12桁IDで同じ曲を再現できます。</div></header>
<div class="wrap">
 <div class="grid">
  <section class="card">
   <div class="controls">
    <button id="compose" class="btn">作曲する</button>
    <button id="loop" class="btn secondary">▶▶ 連続生成</button>
    <button id="play" class="btn secondary" disabled>▶ 再生</button>
    <button id="stop" class="btn stop" disabled>停止</button>
    <button id="save" class="btn secondary" disabled>WAV保存</button>
    <button id="copy" class="btn secondary" disabled>IDコピー</button>
    <input id="idInput" class="input" placeholder="曲ID入力も可" maxlength="12" />
   </div>
   <div class="now" id="now">未作曲</div>
   <div class="meter"><div id="prog"></div></div>
   <div class="sectionbar" id="sectionbar"></div>
   <p class="small">AudioContextは初回操作時に1回だけ生成し、その後は使い回します。WAVは合成済みバッファから保存します。</p>
   <canvas id="wave" width="1000" height="220"></canvas>
  </section>
  <section class="card">
   <div class="info" id="info"></div>
   <h3>エモい機能</h3><div class="tags" id="tags"></div>
   <h3>ログ</h3><div class="log" id="log"></div>
  </section>
 </div>
</div>
<script>
(()=>{
'use strict';
const SR=44100, TARGET=210;
let audioCtx=null, source=null, current=null, startAt=0, raf=0, looping=false;
const $=id=>document.getElementById(id);
const log=s=>{$('log').innerHTML=(new Date().toLocaleTimeString()+"　"+s+"<br>"+$('log').innerHTML).slice(0,4000)};

const pick=(r,a)=>a[Math.floor(r()*a.length)], clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function buildPlan(seed){const r=mulberry32(xmur3(seed)()); const bpm=Math.floor(82+r()*22); const beatsPerBar=4, barSec=240/bpm; const totalBars=Math.round(TARGET/barSec); const forms=[['王道型',['intro','A1','B1','chorus1','A2','B2','chorus2','bridge','bigChorus','outro']],['サビ頭型',['chorusHead','intro','A1','B1','chorus1','A2','bigChorus','outro']],['A-A-B型（演歌古典）',['intro','A1','chorus1','A2','chorus2','bigChorus','outro']],['2ブロック型',['intro','A1','B1','chorus1','bridge','bigChorus','outro']],['転調サビ頭型',['bigChorusHead','intro','A1','B1','chorus1','A2','bigChorus','outro']]];

function generateMelody(p,sec,bar,barT,mod){const r=p.r, notes=[]; const count=p.rhythm==='五七調'?(bar%2?7:5):(bar%2?5:7); const pats5=[[0,1,2,4,3],[2,3,4,2,0],[4,3,2,1,0],[0,2,4,5,4]], pats7=[[0,1,2,3,4,3,2],[2,4,5,4,3,2,0],[4,4,3,2,1,2,0],[0,2,3,5,4,3,2]]; const pat=(count===5?pick(r,pats5):pick(r,pats7)); const motif=[0,2,3,4,2].slice(0,4+Math.floor(r()*2)); const useMotif=bar%4===0||sec.kind==='intro'; const grid=8/count; let prev=null, leapDir=0; for(let j=0;j<count;j++){let deg=(useMotif?motif[j%motif.length]:pat[j]); if(sec.kind==='chorus')deg+=2;if(sec.kind==='B')deg+=1; let octave= Math.floor((deg)/7)*12; let m=p.key+mod+scaleMin[((deg%7)+7)%7]+octave; if(prev!==null){let diff=m-prev; if(Math.abs(diff)>5){m=prev - Math.sign(diff)*2; leapDir=-Math.sign(diff)} else if(leapDir){m=prev+leapDir*2; leapDir=0}} m=clamp(m,57,72); let st=barT+j*grid*p.barSec/2; let du=grid*p.barSec/2*.78; notes.push([st,du,m]); if(r()<.5&&prev!==null&&Math.abs(m-prev)<=4){let mid=prev+Math.sign(m-prev||1);notes.push([st-du*.22,du*.20,clamp(mid,57,72),.45])} prev=m;} if(bar%2===1)notes.push([barT+3.35*p.barSec/4,.55*p.barSec,sec.kind==='chorus'?p.key+12+mod:p.key+mod,1.1]); return notes;}

function rbool(seed,a,b){return (xmur3(seed+':'+a+':'+b)()%2)===0}
function makeAudioBuffer(arr){ensureCtx(); let b=audioCtx.createBuffer(1,arr.length,SR); b.copyToChannel(arr,0); return b}
function drawWave(arr){const c=$('wave'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#08090d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffcf5c';ctx.lineWidth=1.5;ctx.beginPath(); const step=Math.ceil(arr.length/w); for(let x=0;x<w;x++){let min=1,max=-1;for(let j=0;j<step;j++){let v=arr[x*step+j]||0;if(v<min)min=v;if(v>max)max=v}ctx.moveTo(x,h/2+min*h*.42);ctx.lineTo(x,h/2+max*h*.42)}ctx.stroke();}
function updateUI(obj,id){current={...obj,id,audioBuffer:makeAudioBuffer(obj.buffer)}; const p=obj.p; $('now').textContent=`曲ID ${id} / BPM ${p.bpm} / 約${Math.round(p.duration)}秒 / ${p.totalBars}小節`; $('idInput').value=id; $('play').disabled=$('save').disabled=$('copy').disabled=false; let inf=[['主旋律',p.main],['ギター',p.guitar],['ベース',p.bass],['パッド',p.pad],['転調種別',p.mod],['リズム',p.rhythm],['構成タイプ',p.formName],['アウトロ',p.outro],['フィーチャー楽器',p.feature],['ミックス',`Mel ${p.mix.mel.toFixed(2)} / G ${p.mix.gtr.toFixed(2)} / B ${p.mix.bass.toFixed(2)} / D ${p.mix.dr.toFixed(2)}`]]; $('info').innerHTML=inf.map(x=>`<div class="kv"><b>${x[0]}</b><span>${x[1]}</span></div>`).join(''); $('tags').innerHTML=p.emoG.map(x=>`<span class="tag g">Global ${x}</span>`).join('')+p.emoS.map(x=>`<span class="tag s">Spot ${x}</span>`).join(''); $('sectionbar').innerHTML=p.sections.map((s,i)=>`<div class="seg" data-i="${i}" title="${s.name} ${s.bars}小節"><span>${s.name.replace('chorus','サビ').replace('intro','イントロ').replace('outro','アウトロ').replace('bridge','Br')}</span></div>`).join(''); drawWave(obj.buffer); log('作曲完了：'+p.formName+' / '+p.feature);}
function compose(id){ensureCtx(); id=(id&&validId(id))?id:newId(); log('合成中…'); setTimeout(()=>{try{let obj=render(id); updateUI(obj,id);}catch(e){console.error(e);log('エラー：'+e.message)}},10)}
function play(){if(!current)return; ensureCtx(); stop(false); source=audioCtx.createBufferSource(); source.buffer=current.audioBuffer; source.connect(audioCtx.destination); startAt=audioCtx.currentTime; source.start(); $('stop').disabled=false; $('play').disabled=true; tick(); source.onended=()=>{stop(false); if(looping) setTimeout(()=>{compose(newId()); setTimeout(play,500)},700)} }
function stop(killLoop=true){if(killLoop)looping=false; if(source){try{source.stop()}catch{} source.disconnect(); source=null} cancelAnimationFrame(raf); $('stop').disabled=true; $('play').disabled=!current; if(!looping)$('loop').textContent='▶▶ 連続生成';}
function tick(){if(!current||!source)return; let t=audioCtx.currentTime-startAt, p=current.p; $('prog').style.width=Math.min(100,t/p.duration*100)+'%'; [...$('sectionbar').children].forEach((el,i)=>{let s=p.sections[i]; el.classList.toggle('active',t>=s.barStart*p.barSec&&t<(s.barStart+s.bars)*p.barSec)}); raf=requestAnimationFrame(tick)}
function wavBlob(arr){const len=arr.length, buf=new ArrayBuffer(44+len*2), v=new DataView(buf); const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}; ws(0,'RIFF');v.setUint32(4,36+len*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len*2,true);let o=44;for(let i=0;i<len;i++,o+=2){let s=clamp(arr[i],-1,1);v.setInt16(o,s<0?s*0x8000:s*0x7fff,true)}return new Blob([buf],{type:'audio/wav'})}
$('compose').onclick=()=>compose($('idInput').value.trim()); $('play').onclick=play; $('stop').onclick=()=>stop(true); $('loop').onclick=()=>{ensureCtx(); looping=!looping; $('loop').textContent=looping?'連続生成中…停止':'▶▶ 連続生成'; if(looping){compose(newId()); setTimeout(play,650)}else stop(true)}; $('save').onclick=()=>{if(!current)return;let a=document.createElement('a');a.href=URL.createObjectURL(wavBlob(current.buffer));a.download=`kayokyoku_${current.id}.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}; $('copy').onclick=()=>{if(current)navigator.clipboard.writeText(current.id).then(()=>log('IDをコピーしました'))};
})();
</script>
