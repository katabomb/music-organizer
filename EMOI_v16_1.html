const RNG=[[62,90],[55,86],[46,70],[55,86],[28,52],[72,96]],CEN=[72,67,55,67,40,84],SND=[.5,.4,.8,.35,0,.7,.12];
const RG={L:.85,C:.6,H:.5,P:.5,B:.75,T:.28};
const fit=(m,lo,hi)=>{while(m<lo)m+=12;while(m>hi)m-=12;return m};
function plan(aid){const r=R(H('P'+aid+VER)),pc=[0,2,3,5,7,9,10][r()*7|0],sh=[[0,1,2,3,4],[0,2,1,3,4],[0,1,3,2,4]][r()*3|0];return sh.map((sl,i)=>{const c=AR.filter(x=>x.s==sl);return{a:c[r()*c.length|0],i,sl,id:aid+'-'+(i+1),pc:(pc+[0,7,5,9,0][i])%12}})}

function compose(p){
const a=p.a,r=R(H(p.id+VER)),mode=a.m[r()*a.m.length|0],sc=SCL[mode],T0=36+p.pc,bpm=a.bp[0]+Math.round(r()*(a.bp[1]-a.bp[0]));
const pgs=PG[mode],P0=pgs[r()*pgs.length|0];let P1=pgs[r()*pgs.length|0];if(P1==P0)P1=pgs[(pgs.indexOf(P0)+1)%pgs.length];
const sm=d=>T0+sc[((d%7)+7)%7]+12*Math.floor(d/7);
const RT=[[0,3,6,8,12],[0,4,8,10,12,14],[0,2,4,8,10],[0,6,8,12],[0,4,6,8,12]];
const rh=[...RT[r()*5|0],...RT[r()*5|0].map(x=>x+16)];let d0=[0,2,4][r()*3|0]+14;
const M=rh.map((s,k)=>{if(k)d0+=[-2,-1,-1,1,1,2,3][r()*7|0];d0=Math.max(10,Math.min(20,d0));return{s,d:d0,l:(rh[k+1]??32)-s}});
const vary=v=>{let m=M.map(n=>({...n})),span=2,hi=0;
 if(v=='seq')m.forEach(n=>n.d+=1);if(v=='inv')m.forEach(n=>n.d=30-n.d);
 if(v=='high'){m.forEach(n=>n.d+=2);hi=5}
 if(v=='frag'){const f=m.slice(0,3);m=[...f,...f.map(n=>({...n,s:n.s+16,d:n.d+1}))]}
 if(v=='aug'){m.forEach(n=>{n.s*=2;n.l*=2});span=4}
 return{m,span,hi}};
const secs=a.f.split('|').map(x=>{const[k,n,e,ro,v]=x.split(':');return{k,n:+n,e:+e,r:ro,v}});
const CAD={exit:[3,4,0],recall:[3,0],converge:[4,4,0]}[a.end],ex=[0,1,3,5].sort(()=>r()-.5);
const N=[],SEC=[];let bar=0;
const push=(b,d,i,m,v,role)=>N.push({b,d,i,m,v:Math.min(1.2,v),role});
const rng=(i,role,hi)=>{let g=role=='B'?(i==4?[33,55]:[36,52]):role=='H'?(i==5?[60,84]:[46,70]):(i==4&&(role=='L'||role=='C'))?[52,80]:RNG[i];return hi?[g[0]+hi,g[1]+hi]:g};
secs.forEach((s,si)=>{
 const mv=vary(s.v),pg=/^[BCD]/.test(s.k)?P1:P0,outro=s.k=='outro',st=bar*4;
 for(let b=0;b<s.n;b++){
  const gb=bar++,bt=gb*4,fin=outro&&b==s.n-1;
  let roles=s.r.split('');
  if(outro){
   if(a.end=='exit'){roles=secs[si-1].r.split('');ex.slice(0,Math.min(b+1,4)).forEach(i=>roles[i]='S')}
   if(a.end=='recall')roles='LSHSBT'.split('');
   if(a.end=='converge')roles='PCHPBT'.split('');
   if(fin)roles=(a.end=='recall'?'LSHSBS':'SSHSBS').split('');
  }
  const c=outro&&b>=s.n-CAD.length?CAD[b-(s.n-CAD.length)]:pg[b%pg.length];
  const simp=outro&&a.end=='converge'?Math.min(b,2):0,e=outro?s.e*(1-.4*b/s.n):s.e*(.85+.15*(s.n>1?b/(s.n-1):1));
  const cont=.8+.2*Math.sin(Math.PI*(gb%4)/3),cds=[c,c+2,c+4];
  const snap=x=>{for(const q of[0,1,-1])if(cds.some(z=>(((x+q-z)%7)+7)%7==0))return x+q;return x};

   const[lo,hi]=rng(i,role,role=='L'||role=='C'?mv.hi:0),vb=e*cont*RG[role]*(.92+r()*.16),bim=b%mv.span;

     for(let q=st0;q<Math.min(16,st0+n.l);q++)mask[q]=1;
     push(bt+st0/4,Math.min(n.l,16-st0)*.25*.95,i,fit(sm(dd),lo,hi),vb*(st0%8==0?1:.88),role)})}
   if(role=='C'){let q=0;while(q<16){if(mask[q]){q++;continue}let q2=q;while(q2<16&&!mask[q2])q2++;const L=q2-q;
     if(L>=3&&q>0){const dd=snap((lastD??c+9)-2);push(bt+q/4,Math.min(L,6)*.25*.95,i,fit(sm(dd),lo,hi),vb,role);
      if(L>=8)push(bt+(q+4)/4,Math.min(L-4,4)*.25*.95,i,fit(sm(snap(dd+1)),lo,hi),vb*.85,role)}q=q2}}
   if(role=='H'){const dur=fin?8:4;[r0,t3,t5].forEach((m,k)=>{if(e>.7&&!fin){push(bt,2,i,m,vb*.9,role);push(bt+2,2,i,m,vb*.8,role)}else push(bt,dur,i,m,vb*(k?.8:1),role)})}
   if(role=='P'){const tt=[r0,t3,t5,r0+12],pt=[0,1,2,3,2,1];
     let ps=a.g=='sync'?[0,3,6,8,11,14]:a.g=='slow'&&e<=.6?[0,4,8,12]:[0,2,4,6,8,10,12,14];
     if(simp==1)ps=[0,4,8,12];if(simp==2)ps=[0,8];
     ps.forEach((q,k)=>{if(simp==0&&r()<(1-e*1.2)*.3)return;const g=ps.length>1?(ps[k+1]??16)-q:8;

   if(role=='B'){const bp=fin?[[0,32]]:a.g=='slow'?(e>.5?[[0,8],[8,8]]:[[0,16]]):a.g=='drive'?[[0,5],[6,2],[8,5],[12,2],[14,2]]:[[0,6],[6,2],[8,4],[12,2],[14,2]];

});

const noL=Math.round(100*SEC.filter(s=>!s.r.includes('L')).reduce((q,s)=>q+s.en-s.st,0)/os.en);

return{id:p.id,name:a.n,sl:p.sl,mode,key:keyN,bpm,N,SEC,T,dur:T(bar*4+6)+3,
 rep:`役割の入れ替わり ${rc}回 ／ 主旋律のない小節 ${noL}% ／ 頂点: ${pk.k}（強度${pk.e}）／ 終止: ${{exit:'声部の順次退場',recall:'主題の回想（拡大）',converge:'リズムの収束'}[a.end]}`}}

function mkNb(c){const rr=R(7),nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),x=nb.getChannelData(0);for(let k=0;k<x.length;k++)x[k]=rr()*2-1;c._nb=nb}
const WT=[[[1,.55],[2,.28],[3,.12],[4,.04]],[[1,.6],[2,.28],[3,.1]],[[1,.4],[2,.24],[3,.13]],[[1,.6],[2,.3],[3,.15],[4,.07]],[[1,.64],[2,.22],[3,.08]],[[1,.5],[2,.18]]];
function wave(c,i){c._w=c._w||{};if(c._w[i])return c._w[i];const P=WT[i],n=5,re=new Float32Array(n),im=new Float32Array(n);P.forEach(([k,x])=>im[k]=x);return c._w[i]=c.createPeriodicWave(re,im)}
function note(c,dst,i,t,d,m,v){
 const f=440*2**((m-69)/12),o=c.createGain();let a=.01,r=.12,dec=0;const S=[];
 const osc=(dt,out)=>{const s=c.createOscillator();s.setPeriodicWave(wave(c,i));s.frequency.value=f;s.detune.value=dt;s.connect(out);s.start(t);S.push(s)};
 if(i==3){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(Math.min(16000,f*9),t);fl.frequency.exponentialRampToValueAtTime(f*2,t+.25);fl.connect(o);osc(0,fl);dec=.5}
 else if(i==1||i==2){osc(-7,o);osc(7,o);if(i==1){a=.06;r=.28}else{a=.4;r=.7}}
 else{osc(0,o);if(i==0){a=.008;dec=Math.max(.9,d*1.1)}if(i==4){a=.018;r=.08}if(i==5){a=d*.4;r=d*.5}}
 o.connect(dst);
 const e=o.gain;e.setValueAtTime(0,t);e.linearRampToValueAtTime(v,t+a);let end;
 if(dec){e.setTargetAtTime(0,t+a,dec/3);end=t+a+dec*1.3}
 else{e.setValueAtTime(v,Math.max(t+a,t+d));e.linearRampToValueAtTime(0,t+Math.max(a,d)+r);end=t+Math.max(a,d)+r}
 S.forEach(s=>s.stop(end+.05))}
function drum(c,dst,k,t,v){const o=c.createGain();o.connect(dst);
 if(k==0){const s=c.createOscillator();s.frequency.setValueAtTime(190,t);s.frequency.exponentialRampToValueAtTime(48,t+.12);o.gain.setValueAtTime(v,t);o.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(o);s.start(t);s.stop(t+.45);return}
 const s=c.createBufferSource(),f=c.createBiquadFilter(),L=k==1?.16:.05;s.buffer=c._nb;f.type='highpass';f.frequency.value=k==1?1500:7000;s.connect(f);f.connect(o);
 o.gain.setValueAtTime(v,t);o.gain.exponentialRampToValueAtTime(.001,t+L);s.start(t,(t*7)%1);s.stop(t+L+.02);
 if(k==1){const q=c.createOscillator(),g=c.createGain();q.frequency.value=190;g.gain.setValueAtTime(v*.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);q.connect(g);g.connect(dst);q.start(t);q.stop(t+.12)}}
function rig(c,bpm){mkNb(c);const m=c.createGain();m.gain.value=2.4;const cp=c.createDynamicsCompressor();cp.threshold.value=-20;cp.ratio.value=2.2;cp.attack.value=.02;cp.release.value=.3;m.connect(cp);const lm=c.createDynamicsCompressor();lm.threshold.value=-4;lm.knee.value=0;lm.ratio.value=20;lm.attack.value=.003;lm.release.value=.1;cp.connect(lm);lm.connect(c.destination);
 const rr=R(11),len=c.sampleRate*1.8,ib=c.createBuffer(2,len,c.sampleRate);for(let h=0;h<2;h++){const x=ib.getChannelData(h);for(let k=0;k<len;k++)x[k]=(rr()*2-1)*Math.pow(1-k/len,3)}
 const cv=c.createConvolver();cv.buffer=ib;const wg=c.createGain();wg.gain.value=.3;cv.connect(wg);wg.connect(m);
 const dl=c.createDelay(2);dl.delayTime.value=60/bpm*.75;const fb=c.createGain();fb.gain.value=.3;dl.connect(fb);fb.connect(dl);dl.connect(cv);
 return[0,1,2,3,4,5,6].map(i=>{const b=c.createGain();b.connect(m);if(SND[i]){const s=c.createGain();s.gain.value=SND[i];b.connect(s);s.connect(cv)}
  if(i==0||i==3){const s=c.createGain();s.gain.value=.25;b.connect(s);s.connect(dl)}return b})}
let CAL=null;
async function calibrate(){if(CAL)return;const q=[];for(let i=0;i<6;i++){const c=new OfflineAudioContext(1,88200,44100);mkNb(c);note(c,c.destination,i,0,1.2,CEN[i],1);const x=(await c.startRendering()).getChannelData(0);let s=0,n=0;for(let k=0;k<x.length;k++)if(Math.abs(x[k])>.002){s+=x[k]*x[k];n++}q[i]=Math.min(4,.1/Math.sqrt(s/Math.max(n,1)+1e-9))}CAL=q}
function sched(c,s,t0){const bus=rig(c,s.bpm);s.N.forEach(n=>{const a=t0+s.T(n.b),e=t0+s.T(n.b+n.d);n.i==6?(DRUM&&drum(c,bus[6],n.m,a,n.v)):note(c,bus[n.i],n.i,a,e-a,n.m,n.v*CAL[n.i])})}

let DRUM=true,BUS,NP=0,PI=0,SONGS=[],AC=null,T0=0,IDX=0,ALL=false,raf=0;
function setAlbum(id){$('aid').value=id;SONGS=plan(id).map(compose);
 $('list').innerHTML=SONGS.map((s,i)=>`<div class="s" id="s${i}"><b>${i+1}. ${s.name}</b> <span class="mu">［${SLN[s.sl]}］</span> <span class="mu">${s.key} ${s.mode} ／ ♩=${s.bpm} ／ ${s.id}</span></div>`).join('');
 $('arc').textContent='アルバムの流れ: '+SONGS.map(s=>SLN[s.sl]).join(' → ');SONGS.forEach((s,i)=>$('s'+i).onclick=()=>start(i,false));show(0)}
function show(i){IDX=i;const s=SONGS[i];document.querySelectorAll('.s').forEach((x,k)=>x.classList.toggle('on',k==i));
 const tot=s.SEC[s.SEC.length-1].en;$('tl').innerHTML=s.SEC.map(x=>`<div style="flex:${x.en-x.st}">${x.k}</div>`).join('');$('info').textContent=s.rep}
function pump(){if(!AC)return;const s=SONGS[IDX],t=AC.currentTime-T0;while(NP<s.N.length&&s.T(s.N[NP].b)<t+6){const n=s.N[NP++],a=T0+s.T(n.b),e=T0+s.T(n.b+n.d);n.i==6?(DRUM&&drum(AC,BUS[6],n.m,a,n.v)):note(AC,BUS[n.i],n.i,a,e-a,n.m,n.v*CAL[n.i])}}
async function start(i,all){await calibrate();stop();ALL=all;show(i);AC=new AudioContext({latencyHint:'playback'});await AC.resume();T0=AC.currentTime+.3;BUS=rig(AC,SONGS[i].bpm);NP=0;SONGS[i].N.sort((x,y)=>x.b-y.b);pump();PI=setInterval(pump,150);tick()}
function stop(){clearInterval(PI);cancelAnimationFrame(raf);if(AC){AC.close();AC=null}}
function tick(){if(!AC)return;const s=SONGS[IDX],t=AC.currentTime-T0;let k=0;s.SEC.forEach((x,j)=>{if(x.ts<=t)k=j});
 [...$('tl').children].forEach((x,j)=>x.classList.toggle('on',j==k));
 if(t>s.dur){if(ALL&&IDX<4)start(IDX+1,true);else stop();return}raf=requestAnimationFrame(tick)}
async function wav(){await calibrate();const s=SONGS[IDX],c=new OfflineAudioContext(2,Math.ceil(44100*(s.dur+.2)),44100);sched(c,s,.1);const b=await c.startRendering();
 const L=b.getChannelData(0),Rr=b.getChannelData(1),n=L.length,buf=new ArrayBuffer(44+n*4),v=new DataView(buf),w=(o,t)=>[...t].forEach((ch,k)=>v.setUint8(o+k,ch.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,44100,true);v.setUint32(28,176400,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
 const cl=x=>Math.max(-1,Math.min(1,x))*32767;for(let k=0;k<n;k++){v.setInt16(44+k*4,cl(L[k]),true);v.setInt16(46+k*4,cl(Rr[k]),true)}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));a.download='emoi-'+s.id+'.wav';a.click()}
$('rnd').onclick=()=>setAlbum(Math.random().toString(36).slice(2,8));
$('aid').onchange=()=>$('aid').value&&setAlbum($('aid').value.trim());
$('go').onclick=()=>start(0,true);$('st').onclick=stop;
$('pa').onclick=()=>{if(!AC)return;AC.state=='running'?AC.suspend():AC.resume()};
$('dr').onchange=()=>DRUM=$('dr').checked;$('wv').onclick=wav;
setAlbum('emoi01');
</script></body></html>
